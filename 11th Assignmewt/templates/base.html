<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Generator</title>
    <style>
      body{font-family: Arial, sans-serif; background:#fff;color:#111;margin:0}
      .nav{background:#f7f7f7;padding:10px 16px;border-bottom:1px solid #eee}
      .container{padding:20px}
      .sidebar{width:200px;float:left;padding:20px;border-right:1px solid #eee}
      .content{margin-left:220px;padding:20px}
      .card{padding:12px;border:1px solid #eee;border-radius:6px;margin-bottom:10px}
      table{width:100%;border-collapse:collapse}
      th,td{padding:8px;border-bottom:1px solid #eee}
      .btn{display:inline-block;padding:8px 12px;background:#0b74de;color:#fff;border-radius:6px;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="nav">
      <span>Resume Generator</span>
      <span style="float:right">
        {% if user.is_authenticated %}
          <a href="/accounts/logout/">Logout</a>
        {% else %}
          <a href="/accounts/login/">Login</a>
        {% endif %}
      </span>
    </div>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
