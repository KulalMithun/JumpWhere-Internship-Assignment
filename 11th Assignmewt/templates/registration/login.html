{% extends 'base.html' %}
{% block content %}
<div style="max-width:420px;margin:40px auto">
  <h2>Login</h2>
  {% if form.errors %}<div class="card">Invalid credentials</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div><label>Username</label><br><input type="text" name="username"></div>
    <div><label>Password</label><br><input type="password" name="password"></div>
    <div style="margin-top:10px"><button class="btn" type="submit">Login</button></div>
  </form>
</div>
{% endblock %}
