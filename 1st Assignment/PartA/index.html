<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demonstration Page</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
        }
        header { 
            background: #f4f4f4; padding: 1rem; text-align: center;
        }
        nav { 
            background: #333; color: #fff; padding: 0.5rem; 
            text-align: center; 
        }
        nav a { 
            color: #fff; 
            margin: 0 10px; 
            text-decoration: none; 
            font-weight: bold; 
        }
        .content { 
            padding: 20px; 
        }
        button { 
            padding: 10px 20px; 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-style: italic; 
        }
        footer { 
            background: #333; 
            color: white; 
            text-align: center; 
            padding: 10px; 
            margin-top: 20px; 
        }
        .highlight { 
            font-family: 'Courier New', Courier, monospace; 
            color: #d9534f; 
        }
    </style>
</head>
<body>
<header>
    <h1>Demo Page</h1>
</header>
<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>
<div class="content">
    <h2>Lists Example:</h2>
    <p>Here is an <span class="highlight">unordered list</span></p>
    <ul>
        <li>apple</li>
        <li>banana</li>
    </ul>
    <p>Here is an <strong>ordered list</strong></p>
    <ol>
        <li>First Step</li>
        <li>Second Step</li>
    </ol>
    <h2>Interactive Elements</h2>
    <p>Check out this <a href="https://www.google.com" target="_blank">Anchor tag link</a>.</p>
    <button onclick="alert('Button Clicked!')">Click Me!</button>
    <br><br>
    <img src="https://via.placeholder.com/150" alt="Sample Placeholder Image">
</div>
<footer>
    <p>&copy; 2026 Demonstration Website</p>
</footer>
</body>
</html>
